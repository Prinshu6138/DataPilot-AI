services:
  - type: web
    name: datapilot-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: datapilot-postgres
          property: connectionString
      - key: COOKIE_SECURE
        value: 'true'
      - key: ENABLE_DEMO
        value: 'false'

databases:
  - name: datapilot-postgres
    plan: free
    ipAllowList: []